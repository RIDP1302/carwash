<h1>Pengaturan Sistem</h1>

<h2>💰 Harga & Layanan</h2>
<p><label>Harga Cuci Mesin (Reguler):<br>
<input type="text" id="set-harga-reguler" value="Rp 500.000"></label></p>
<p><label>Persentase Diskon B2B (Showroom):<br>
<input type="text" id="set-diskon-b2b" value="15%"></label></p>
<p><small>Sistem akan otomatis memotong harga reguler untuk klien berstatus B2B.</small></p>

<hr>

<h2>🏢 Profil Bisnis</h2>
<p><label>Logo Perusahaan:<br><input type="file" id="set-logo"></label></p>
<p><label>Nama Bisnis:<br><input type="text" id="set-nama-bisnis" value="CuciMesin Carwash"></label></p>
<p><label>Slogan (Tagline):<br><input type="text" id="set-tagline" value="#PastiBersih,PastiTerjangkau!"></label></p>
<p><label>Kontak Utama (WhatsApp):<br><input type="tel" id="set-wa" value="0812-3456-7890"></label></p>
<p><label>Alamat Operasional:<br><input type="text" id="set-alamat" value="Jl. Letda Sucipto, Tuban"></label></p>

<p><button type="submit">Simpan Pengaturan</button></p>
