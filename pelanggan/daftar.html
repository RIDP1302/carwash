<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Daftar Akun Baru — CuciMesin</title>
</head>
<body>

<h1>Daftar Akun Baru</h1>
<p>Lengkapi data di bawah ini untuk mulai menggunakan layanan kami.</p>

<form id="form-daftar" action="dashboard.html" method="POST">
<p><label>Nama Lengkap:<br>
<input type="text" name="nama" id="daftar-nama" required></label></p>
<p><label>Nomor WhatsApp (Aktif):<br>
<input type="tel" name="wa" id="daftar-wa" placeholder="+62 81234567890" required></label></p>
<p><label>Kata Sandi:<br>
<input type="password" name="password" id="daftar-password" required></label></p>
<p><label>Konfirmasi Kata Sandi:<br>
<input type="password" name="password2" id="daftar-password2" required></label></p>
<p><input type="checkbox" name="setuju" required> Saya setuju dengan Syarat & Ketentuan yang berlaku.</p>
<p><button type="submit">Buat Akun Sekarang</button></p>
</form>

<p>Sudah punya akun? <a href="index.html">Masuk di sini</a></p>

</body>
</html>
